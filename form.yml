---
cluster: "zurada"

attributes:
  modules: 
    value: "miniforge3"
    label: "Modules to load"
  extra_jupyter_args: 
    value: ""
    label: "Extra Jupyter Arguments"
  mode:
    widget: "radio"
    value: "1"
    options:
      - ["Jupyter Lab", "1"]
      - ["Jupyter Notebook", "0"]
  working_dir:
    widget: "path_selector"
    label: "Root Directory"
    show_hidden: false
    show_files: false
    help: "Select your project directory; defaults to $HOME"

form:
  - modules
  - extra_jupyter_args
  - mode
  - working_dir
  - bc_account
  - bc_queue
  - bc_num_hours
  - bc_num_slots
  - bc_email_on_started
